---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
  namespace: flux-system
spec:
  targetNamespace: cert-manager
  interval: 30m
  dependsOn:
    - name: cert-manager
      namespace: flux-system
  chart:
    spec:
      chart: trust-manager
      version: "0.*"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
