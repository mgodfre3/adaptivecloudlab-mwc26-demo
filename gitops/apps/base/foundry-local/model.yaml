apiVersion: v1
kind: Namespace
metadata:
  name: foundry-local-operator
  labels:
    app: edge-ai
    demo: mwc26
---
# Microsoft.Foundry Arc extension (new CRD schema). The operator's release
# namespace is foundry-local-operator; CRs MUST live there because the cache
# Job that downloads the model references ConfigMap
# foundry-otel-sidecar-config by name (only resolves in the same namespace).
#
# Using model.catalog.name lets the operator auto-create StoreModel + Model
# from the foundry-local-catalog ConfigMap — no need to hand-author them.
apiVersion: foundrylocal.azure.com/v1
kind: ModelDeployment
metadata:
  name: phi-4-deployment
  namespace: foundry-local-operator
spec:
  model:
    catalog:
      name: phi-4-mini
  workloadType: generative
  compute: gpu
  runtime: onnx-genai
  replicas: 1
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "3Gi"
      gpu: 1                    # bare `gpu`, NOT `nvidia.com/gpu`
