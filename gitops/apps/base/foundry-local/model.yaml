apiVersion: v1
kind: Namespace
metadata:
  name: foundry-local
  labels:
    app: edge-ai
    demo: mwc26
---
apiVersion: foundrylocal.azure.com/v1
kind: Model
metadata:
  name: phi-4-mini
  namespace: foundry-local
spec:
  displayName: "Phi-4 Mini Instruct"
  description: "Microsoft Phi-4 Mini - compact 14B parameter SLM for edge AI inference"
  publisher: "Microsoft"
  source:
    type: catalog
    catalog:
      alias: "phi-4-mini"
---
apiVersion: foundrylocal.azure.com/v1
kind: ModelDeployment
metadata:
  name: phi-4-deployment
  namespace: foundry-local
spec:
  displayName: "Phi-4 Edge AI Deployment"
  model:
    ref: phi-4-mini
  workloadType: generative
  compute: gpu
  replicas: 1
  resources:
    requests:
      cpu: "1"
      memory: "4Gi"
    limits:
      cpu: "3"
      memory: "5Gi"
      gpu: 1
  authentication:
    enabled: true
