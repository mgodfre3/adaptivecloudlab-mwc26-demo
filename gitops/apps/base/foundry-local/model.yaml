apiVersion: foundrylocal.azure.com/v1
kind: ModelDeployment
metadata:
  name: phi-4-deployment
  namespace: foundry-local-operator
spec:
  displayName: "Phi-4 mini (CUDA GPU)"
  model:
    catalog:
      name: "Phi-4-mini-instruct-cuda-gpu"
      version: "5"
  workloadType: generative
  compute: gpu
  runtime: onnx-genai
  replicas: 1
  port: 5000
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  resources:
    requests:
      cpu: "300m"
      memory: "1Gi"
    limits:
      cpu: "4000m"
      memory: "12Gi"
      gpu: 1
