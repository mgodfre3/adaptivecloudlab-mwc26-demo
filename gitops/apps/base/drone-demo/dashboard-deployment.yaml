apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: drone-demo
  labels:
    app: dashboard
    app.kubernetes.io/part-of: mwc26-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: acxcontregwus2-c6chcgfjardafsb5.azurecr.io/drone-demo/dashboard:latest
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: drone-demo-config
            - secretRef:
                name: drone-demo-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 30
      imagePullSecrets:
        - name: acr-pull-secret
