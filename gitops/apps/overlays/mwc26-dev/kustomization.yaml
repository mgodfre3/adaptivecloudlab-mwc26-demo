apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Dev cluster: only drone-demo (no MetalLB, Foundry, or watchdog)
resources:
  - ../../base/drone-demo
patches:
  # -- Drone Demo ConfigMap: Dev-specific values --
  - target:
      kind: ConfigMap
      name: drone-demo-config
      namespace: drone-demo
    patch: |
      - op: replace
        path: /data/FLASK_SECRET_KEY
        value: "mwc26-demo-dashboard-dev"
      - op: replace
        path: /data/IOT_HUB_NAME
        value: "pdx-iothub"
      - op: replace
        path: /data/MAP_LOCATION_NAME
        value: "Denver, CO (Dev)"
      - op: replace
        path: /data/MAP_CENTER_LAT
        value: "39.7484"
      - op: replace
        path: /data/MAP_CENTER_LON
        value: "-104.9951"
      - op: replace
        path: /data/MAP_BASE_LAT
        value: "39.7437"
      - op: replace
        path: /data/MAP_BASE_LON
        value: "-104.9916"
      - op: replace
        path: /data/MAP_ZOOM
        value: "13"

  # -- Ingress: dev hostname --
  - target:
      kind: Ingress
      name: dashboard
      namespace: drone-demo
    patch: |
      - op: replace
        path: /spec/tls/0/hosts/0
        value: "mwc-dev.adaptivecloudlab.com"
      - op: replace
        path: /spec/rules/0/host
        value: "mwc-dev.adaptivecloudlab.com"

  # -- TLS Certificate DNS names --
  - target:
      kind: Certificate
      name: drone-demo-tls
      namespace: drone-demo
    patch: |
      - op: replace
        path: /spec/dnsNames
        value:
          - "mwc-dev.adaptivecloudlab.com"
          - "*.mwc-dev.adaptivecloudlab.com"
