# Foundry Local CRs for the Microsoft.Foundry Arc extension (new schema).
#
# REPLACES k8s/foundry-local.yaml and k8s/vi-foundry-local.yaml (those use the
# OLD inferenceoperator@0.0.1-prp.5 Helm chart's CRD schema and will fail to
# apply with strict-decoding errors against the new extension).
#
# Two valid approaches:
#
#   A) Catalog ref (RECOMMENDED for built-in models) — let the operator
#      auto-create StoreModel + Model from the foundry-local-catalog ConfigMap.
#      Just write a ModelDeployment with `model.catalog.name`.
#
#   B) Manual StoreModel + Model — only needed for BYO custom OCI registry
#      sources or when you want explicit control of variants.
#
# This file uses (A). CRs MUST be in the operator's release namespace
# (foundry-local-operator) — the cache Job references the
# `foundry-otel-sidecar-config` ConfigMap by name, which only exists in the
# operator namespace.
---
apiVersion: foundrylocal.azure.com/v1
kind: ModelDeployment
metadata:
  name: phi-4-deployment
  namespace: foundry-local-operator
spec:
  model:
    catalog:
      name: phi-4-mini          # resolved from foundry-local-catalog ConfigMap
      # version: latest         # optional, defaults to latest
  compute: gpu                  # cpu | gpu
  workloadType: generative      # generative | predictive
  runtime: onnx-genai           # onnx-genai | vllm | maas
  replicas: 1
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "3Gi"
      gpu: 1                    # schema uses bare `gpu`, NOT `nvidia.com/gpu`
  # Optional: expose via ingress
  # endpoint:
  #   enabled: true
  #   host: phi-4.example.com
  #   ingressClassName: nginx
  #   tls:
  #     enabled: true
  #     secretName: phi-4-tls
