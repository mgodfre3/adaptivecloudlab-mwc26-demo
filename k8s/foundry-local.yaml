# =============================================================================
# Foundry Local - Edge AI Inference on AKS Arc (Azure Local)
# Denver 2026 Demo: Real-Time Drone Network Monitoring with Edge AI
# =============================================================================
# Deploys Phi-4 Mini in the Foundry Local extension's namespace.
# The operator manages the ModelDeployment
# lifecycle, including model download, GPU scheduling, TLS, and API key auth.
# =============================================================================

# =============================================================================
# ModelDeployment: GPU-accelerated generative inference endpoint
# =============================================================================
apiVersion: foundrylocal.azure.com/v1
kind: ModelDeployment
metadata:
  name: phi-4-deployment
  namespace: foundry-local-operator
spec:
  displayName: "Phi-4 mini (CUDA GPU)"
  model:
    catalog:
      name: "Phi-4-mini-instruct-cuda-gpu"
      version: "5"
  workloadType: generative
  compute: gpu
  runtime: onnx-genai
  replicas: 1
  port: 5000
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  resources:
    requests:
      cpu: "300m"
      memory: "1Gi"
    limits:
      cpu: "4000m"
      memory: "12Gi"
      gpu: 1
